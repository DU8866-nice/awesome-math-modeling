  - id: focused
    zh: "专项 Skill：选题、选模型、单题型、摘要"
    en: "Focused skills: problem choice, model choice, one problem type, abstracts"
    zh_intro: "只管一个环节的小工具，可以和上面的全流程 skill 搭配使用。"
    en_intro: "Small tools for one step that pair well with the full-workflow skills above."
    items:
      - repo: XiucuiGuan/shumo-expert
        zh: "引导式学习：布鲁姆分层提问、苏格拉底追问、四阶段建模引导，只讲方法，不代求解、不代写代码，适合赛前训练和教学。"
        en: "A tutor that uses layered and Socratic questioning and a four-phase modeling guide; it teaches method only and will not solve or write code for you, which suits training and teaching."
        mode: guide
        tags: [gmcm]
      - repo: y3519712124-ui/math-modeling-contest-route-selection
        zh: "选题和路线选择：逐题比较建模路线、可行性、验证方式和推翻条件，避免一上来就套 TOPSIS、熵权法、LSTM 的同质化方案。"
        en: "Problem and route choice that compares each problem's modeling route, feasibility, validation and what would overturn it, instead of reaching for TOPSIS, entropy weights or LSTM by default."
        tags: [cumcm, mcm]
      - repo: bydtesla1609/cumcm-taste
        zh: "选模型之前先做事实审查：哪些现实因素会改变结果、哪些能省略、有没有阈值或滞后效应，先出“方法准入报告”再选模型。"
        en: "A reality check before choosing a model: which real factors change the result, which can be dropped and whether thresholds or lags matter, written up before any model is allowed."
        tags: [cumcm]
      - repo: liufanshan11/cumcm-b-problem-lfs
        zh: "只做国赛 B 题：机理、几何、统计优先，内置摘要、总括方程组、图表设计和 25–29 页的论文节奏。"
        en: "CUMCM Problem B only: mechanism, geometry and statistics first, with built-in guidance for the abstract, the summary equations, figures and a 25–29 page paper."
        tags: [cumcm]
      - repo: liufanshan11/cumcm-c-problem-lfs
        zh: "只做国赛 C 题：依据 2018–2025 年 C 题优秀论文和评阅规范，统计、预测、评价和优化方法优先，沿用 cumcmthesis 模板。"
        en: "CUMCM Problem C only, based on 2018–2025 outstanding C papers and judging notes; favors statistics, forecasting, evaluation and optimization and uses the cumcmthesis template."
        tags: [cumcm]
      - repo: jjh666888/cumcm-abstract-writing-skill
        zh: "国赛摘要专用：写、改、评摘要，起草后再以评委视角复核事实和质量。"
        en: "For CUMCM abstracts only: writes, revises or critiques an abstract, then re-checks facts and quality from a judge's point of view."
        tags: [cumcm]
      - repo: Mr-potato-123/cumcm-paper-hand-skill
        zh: "论文手：在已整理好建模和求解材料的参赛文件夹里写论文，内置获奖论文参考库和 LaTeX 模板。"
        en: "A paper-writer skill that works in a contest folder where models and results are already organized, with a library of winning papers and a LaTeX template."
        tags: [cumcm, mcm]
      - repo: haoxilin/cumcm-live-workflow-skill
        zh: "经过真实国赛检验的实战手册：读题自查、出图、LaTeX、交叉审阅、填结果模板，含 2026 版 AI 使用规定和 26 条终审自查表。"
        en: "A field manual tested in a real CUMCM: reading checks, figures, LaTeX, cross review and result templates, with the 2026 AI-use rules and a 26-item final checklist."
        tags: [cumcm]
      - repo: siyunhao2025-beep/math-modeling-to-sci-skill
        zh: "赛后把建模报告或竞赛论文改造成可投稿的 SCI 论文：重新界定研究问题，补基线和稳健性，核对引用和期刊匹配。"
        en: "After the contest, turns a modeling report or contest paper into a journal submission by reframing the research question, adding baselines and robustness and checking citations and journal fit."
      - repo: DDXYY189/zhengdabei-survey-report-skill
        zh: "正大杯市场调查与分析大赛报告 skill：调查设计、统计方法、结论建议和提交前审查，含 AI 使用说明。"
        en: "For the Zhengda Cup market research contest: survey design, statistical methods, recommendations and a pre-submission audit, including the AI-use statement."
        tags: [other]
      - repo: yugwl/-MCM-ICM-CUMCM-100-AI-Prompts-
        zh: "100 条数学建模提示词，按比赛流程分成 8 个阶段，任何聊天机器人都能用。"
        en: "100 prompts for modeling contests in eight stages of the contest, usable in any chatbot."
        prompt: true
        tags: [mcm, cumcm]

  - id: gmcm
    zh: "研究生赛（华为杯）专用"
    en: "For the graduate contest (Huawei Cup)"
    zh_intro: "中国研究生数学建模竞赛的专用 skill，多数蒸馏了历年获奖论文。"
    en_intro: "Skills built for the China Graduate Mathematical Contest in Modeling, mostly distilled from past winning papers."
