# Source of truth for README.md and README.en.md.
# Edit this file, then run: python scripts/build_readme.py
# Each entry needs `repo`, `zh` and `en`. Keep descriptions to one or two sentences.
# Optional fields:
#   mode:    auto | collab | guide   (only when the project's README says so)
#   tags:    cumcm | mcm | gmcm | other   (contests the project names)
#   skills:  number of skills in the repo
#   prompt:  true for prompt collections that are not installable skills
#   note_zh / note_en: one short note shown under the entry
# Category option `static: true` turns off the 💤 mark for content that does not need updates (papers, notes).

categories:
  - id: agents
    zh: "全流程 Agent 应用"
    en: "End-to-end agent apps"
    zh_intro: "装好就能用的桌面或网页应用，把读题、建模、写代码、出图、写论文串成一条流水线。大多需要自己填大模型 API Key。"
    en_intro: "Desktop or web apps that chain problem analysis, modeling, coding, figures and paper writing. Most need your own model API key."
    items:
      - repo: jihe520/MathModelAgent
        zh: "数学建模专用 Agent，自动分析问题、建模、写代码、纠错并撰写论文；桌面版内置 Claude Code 和全套 skill，填一个 API Key 即可开始。"
        en: "A modeling agent that analyzes the problem, builds models, writes and fixes code and drafts the paper; the desktop build bundles Claude Code and its skills, so you only add an API key."
        mode: auto
        skills: 11
      - repo: usail-hkust/LLM-MM-Agent
        zh: "港科大 MM-Agent（NeurIPS 2025），把真实建模问题拆成分析、建模、求解、写作的智能体流程；新版另提供可装进 Codex、Claude Code、Cursor 的「数学建模专家」技能包。"
        en: "MM-Agent from HKUST (NeurIPS 2025), an agent pipeline for real-world modeling problems; a newer release adds a Mathematical Modeling Expert skill pack for Codex, Claude Code and Cursor."
        mode: auto
        tags: [mcm]
      - repo: zhou2030109-glitch/Remit
        zh: "Remit 数模小助手：协调、建模、代码、论文四个 Agent 像一支队伍协作，题意、方案和最终成果由你确认；本地运行，可断点恢复。"
        en: "Remit, a local workspace where coordinator, modeler, coder and writer agents work like a team while you sign off on the problem reading, the approach and the result; runs can resume from checkpoints."
        mode: collab
      - repo: yjz211/HaJiMi-Math-Model-Agent
        zh: "本地桌面智能体，0–9 阶段的有状态工作流：冻结题目和数据、逐问建模求解、出图、LaTeX 论文，人工验收后生成代码附录、AI 使用说明和提交包。"
        en: "A local desktop agent with a stateful 0–9 stage workflow, from freezing the problem and data to per-question models, figures and a LaTeX paper, then a code appendix, AI-use statement and submission zip after your review."
        mode: collab
      - repo: 123-qw-as/Beacon
        zh: "基于 LangGraph 的多智能体流水线，面向美赛和研赛：读题、建模、写代码、出图、成文并编译 PDF，关键节点人工审核；有网页界面和命令行。"
        en: "A LangGraph multi-agent pipeline for MCM/ICM and graduate contests that analyzes, models, codes, plots and compiles a PDF paper, with human review at key checkpoints; web UI and CLI."
        mode: collab
        tags: [mcm, gmcm]
      - repo: sghwr/AutoMM
        zh: "基于 DeepSeek Harness 的全自动研究流程，按小问推进理解、文献、假设、公式、计算和校验，附实时仪表盘；当前版本不写论文。"
        en: "A fully automatic research harness built on DeepSeek Harness that works question by question through reading, literature, assumptions, formulas, computation and checks, with a live dashboard; it does not write the paper yet."
        mode: auto
        skills: 12
      - repo: zxuexingzhijie/MathAgent
        zh: "基于 Spring AI Alibaba Graph 和 Vue 的建模研究系统，多智能体加代码解释器，自动构建、求解模型并输出报告。"
        en: "A modeling research system on Spring AI Alibaba Graph and Vue, with multiple agents and a code interpreter that build and solve models and write a report."
        mode: auto

  - id: skills
    zh: "全流程 Skill（Claude Code / Codex 等）"
    en: "Full-workflow skills (Claude Code, Codex and others)"
    zh_intro: "装进编程 Agent 的技能包，从读题一直覆盖到论文和提交检查。多数是标准 SKILL.md 格式，Claude Code、Codex、Trae、WorkBuddy 等支持 skill 的工具都能装。"
    en_intro: "Skill packs for coding agents that cover the whole contest, from reading the problem to the paper and submission checks. Most use the standard SKILL.md format."
    items:
      - repo: XiaoMaColtAI/math-modeling-skill
        zh: "建模分析 → 代码实现 → 论文撰写三阶段，可以只跑其中一段；Python 和 MATLAB 双语言，附优化、预测、评价、图论等算法资源库，产出 Word 论文。"
        en: "Three stages, analysis, code and paper, that can also run one at a time; Python and MATLAB, an algorithm library for optimization, forecasting, evaluation and graphs, and a Word paper at the end."
        tags: [cumcm, mcm]
        skills: 14
      - repo: zhnnky329/MathModeling-skills
        zh: "新版从“自动驾驶”改为“助手”：两道硬门由你决定，三个审计角色把关能否提交；支持 Python 与 MATLAB / 北太天元，旧的全自动版保留在 legacy 分支。"
        en: "Now an assistant rather than an autopilot: you decide two hard gates and three auditors decide whether the paper is ready; Python and MATLAB/Baltamatica branches, with the old full-auto version kept on a legacy branch."
        mode: collab
        skills: 28
      - repo: yushui2022/MathModel-Skill
        zh: "分 Lite / Flash / Standard / Pro 四档，Agent 真正运行代码、整理图表和证据后再写论文并检查，支持原生 Word 公式和 PDF 渲染检查；适配 Trae、Claude Code、Codex。"
        en: "Four tiers, Lite to Pro, where the agent actually runs code and gathers figures and evidence before writing and checking the paper, with native Word equations and PDF render checks; for Trae, Claude Code and Codex."
        skills: 12
      - repo: Lupynow/math-modeling-skills
        zh: "解题和写论文两个 skill，规则提炼自 150 多篇国赛一等、美赛 O/F 奖论文，含 95+ 场景的模型决策矩阵、8 本算法手册和 22 个 Python 模板。"
        en: "A solver skill and a paper skill whose rules come from 150+ CUMCM first-prize and MCM/ICM O/F papers, with a 95-scenario model decision matrix, eight algorithm cookbooks and 22 Python templates."
        tags: [cumcm, mcm]
        skills: 2
      - repo: sweetcornna/mathodology
        zh: "9 个技能、8 个角色加一个桌面工作台：记录实验、核对论文里的数字和图表、核验引用，附 46 类图表模板和敏感性、蒙特卡罗等 18 个实验组件。"
        en: "Nine skills, eight roles and a desktop workbench that logs runs, checks the paper's numbers and figures and verifies citations, plus 46 chart templates and 18 experiment components such as sensitivity and Monte Carlo."
        tags: [mcm, cumcm, other]
        skills: 9
      - repo: handsomeZR-netizen/mathmodel-skill
        zh: "把比赛拆成 10 个阶段和一份共享决策日志，团队只回答编号问题，随时说“看进度”；提交前检查匿名、页数和 AI 披露。"
        en: "Splits the contest into ten stages with a shared decision log; the team answers numbered questions and can ask for progress at any time, and anonymity, page limits and AI disclosure are checked before submission."
        mode: collab
        tags: [cumcm, mcm, other]
        skills: 2
      - repo: RealSeaberry/AutoMCM-Pro
        zh: "让 Claude Code 当“自动驾驶”、人当副驾驶的实验：读题、文献、推导、自证代码到 LaTeX 论文自动推进，人在关键节点审阅；也支持 Codex、opencode、DeepSeek Harness。"
        en: "An experiment where Claude Code is the autopilot and you are the copilot, driving from problem reading and literature to self-checked code and a LaTeX paper while you review at key points; also runs on Codex, opencode and DeepSeek Harness."
        mode: auto
        skills: 7
      - repo: xuec699-sudo/math-modeling-skills
