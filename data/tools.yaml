        tags: [cumcm, mcm, other]
        skills: 8
      - repo: anticipate218/math-modeling-skill
        zh: "定位是“懂规则、懂评阅的教练”而不是自动写论文：审题选题、选模型、做检验、按规范写，提交前逐项检查会直接出局的红线。"
        en: "Pitched as a coach that knows the rules and the judging, not a paper generator: problem choice, model choice, validation and writing to spec, with a pre-submission check of disqualifying mistakes."
        mode: collab
        tags: [cumcm, gmcm, mcm]
      - repo: capwitf/My-MathModeling-skills
        zh: "14 个按需触发的 skill，需要题面、建模、代码、图表、审查或排版时再介入，整理好证据和风险后把判断交还给人。"
