        mode: collab
        tags: [cumcm]
        skills: 14
      - repo: LEEHAHAHAHA/math-modeling-skill
        zh: "七阶段从读题到交付，机理模型优先，每问给 2–3 个不同方案，机器学习只做稳健性检验；附国赛 LaTeX 模板，可用于 Claude Code、Codex、WorkBuddy。"
        en: "Seven stages from reading to delivery that favor mechanistic models, offer two or three distinct options per question and use machine learning only as a robustness check; ships a CUMCM LaTeX template."
        tags: [cumcm, mcm]
        skills: 2
      - repo: zhu-hailin/cumcm-modeling-analyst
        zh: "在国赛里实际用过的协作 skill，逐问确认，把题目、模型和证据整理成队友看得懂的论文和交付物。"
        en: "A collaboration skill used in a real CUMCM that confirms each question with you and turns the problem, models and evidence into a paper and files teammates can follow."
        mode: collab
        tags: [cumcm]
      - repo: woodfishhhh/EZ_math_model
        zh: "固定七阶段：题目解析、建模、Python 求解、论文、质量审查和打包，一次运行输出 Markdown / Word / PDF 论文和代码包。"
        en: "A fixed seven-stage run, from parsing and modeling to Python solving, paper, review and packaging, that outputs the paper as Markdown, Word and PDF plus the code."
        mode: auto
        tags: [cumcm, mcm, gmcm]
        skills: 29
      - repo: chengyike20110519-create/MathModelRun
        zh: "证据驱动的十阶段执行系统：复现实验、冻结结果、渲染论文、独立审计，适用国赛、美赛和 HiMCM。"
        en: "An evidence-driven ten-stage system with reproducible experiments, frozen results, rendered papers and an independent audit, for CUMCM, MCM/ICM and HiMCM."
